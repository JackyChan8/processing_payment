[project]
name = "async-processing-payment"
version = "0.0.1"
description = "Асинхронный сервис процессинга платежей"
authors = [
    {name = "alxn19",email = "alxn19@yandex.ru"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.3,<3.0.0)",
    "black (>=26.10.0,<27.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "faststream[cli,rabbit] (>=0.7.7,<0.8.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
